name: Auto Sync Upstream

on:
  schedule:
    # 每天 UTC 时间 00:00 (北京时间早 8:00) 自动触发
    - cron: '0 0 * * *'
  # 支持在 Actions 页面手动点击运行
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4

    - name: Sync Upstream
      uses: a20185/Upstream-Sync@v2.0
      with:
        upstream_repo: FGBLH/HKL
        upstream_branch: main
        target_branch: main
        # 强制同步（覆写本地改动，保持和上游完全一致）
        force: true
