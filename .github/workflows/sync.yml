name: Auto Sync Upstream

on:
  schedule:
    # 每天 UTC 时间 00:00 (北京时间早 8:00) 自动同步
    - cron: '0 0 * * *'
  # 支持手动在 Actions 页面点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 使用 GitHub 官方 CLI 直接同步上游仓库的 main 分支
          gh repo sync ${{ github.repository }} -b main
