name: Auto Sync Upstream

on:
  schedule:
    # 对应的 UTC 时间为：23:00 (前一天), 07:00, 14:00
    # 换算成北京时间即为：早上 07:00、下午 15:00、晚上 22:00
    - cron: '0 23,7,14 * * *'
  # 支持手动在 Actions 页面点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main
